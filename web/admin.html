<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="color-scheme" content="dark light"/><title>deal-radar admin</title>
<link rel="stylesheet" href="/static/tailwind.css"/>
<style>.card{background:#fff;border:1px solid rgb(226 232 240);border-radius:.75rem;padding:.75rem;margin:.625rem 0}
.dark .card{background:#0f172a;border-color:#1e293b}
table{border-collapse:collapse;width:100%}td,th{border:1px solid rgb(203 213 225);padding:6px 8px;text-align:left;font-size:13px}
.dark td,.dark th{border-color:#1e293b}small{opacity:.7}</style>
</head><body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
<main class="max-w-5xl mx-auto p-4"><div class="flex items-center gap-3"><h2 class="text-xl font-bold">deal-radar admin</h2>
<button class="text-sm underline" onclick="(function(){const r=document.documentElement;const t=r.classList.contains('dark')?'':'dark';r.classList.toggle('dark',t==='dark');localStorage.setItem('drt',t||'light')})()">◐ theme</button></div>
<p class="text-sm"><a href="/" class="text-blue-500">← search</a> · auto-refreshes every 15s</p>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('drt')||'dark')!=='light')</script>
<div class="card"><h3>Drivers</h3><div id="drivers"></div></div>
<div class="card"><h3>Pipeline metrics</h3><div id="metrics"></div></div>
<div class="card"><h3>Searches (<span id="nsearch">0</span>)</h3><div id="searches"></div></div>
<div class="card"><h3>Live events (<span id="nev">0</span>)</h3><div id="events"></div></div>
</main><script>
async function tick(){try{
const m=await(await fetch('/metrics.json')).json();
document.getElementById('drivers').innerHTML='<table><tr><th>driver</th><th>ok</th><th>degraded</th><th>failures</th><th>last error</th></tr>'+
Object.entries(m.drivers).map(([k,v])=>`<tr><td>${k}</td><td>${v.ok}</td><td>${v.degraded}</td><td>${v.consecutive_failures}</td><td>${(v.last_error||'').slice(0,120)}</td></tr>`).join('')+'</table>';
const m2=m.metrics;
document.getElementById('metrics').innerHTML='<table>'+
Object.entries(m2.counters).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')+
Object.entries(m2.latency_avg_ms).map(([k,v])=>`<tr><td>latency ${k}</td><td>${v} ms</td></tr>`).join('')+'</table>';
document.getElementById('searches').innerHTML='<table><tr><th>id</th><th>keywords</th><th>watch</th><th>sources</th></tr>'+
(m.watchlist||[]).map(s=>`<tr><td>${s.id}</td><td>${s.keywords}</td><td>${s.watch}</td><td>${(s.sources||[]).join(',')}</td></tr>`).join('')+'</table>';
document.getElementById('nsearch').textContent=(m.watchlist||[]).length;
document.getElementById('events').innerHTML=(m.events_tail||[]).slice().reverse().map(e=>`<div>${e.kind||'?'}: ${(e.title||e.listing_id||'').slice(0,100)}</div>`).join('')||'none yet';
document.getElementById('nev').textContent=m.events||0;
}catch(e){}}
setInterval(tick,15000);tick();
</script></body></html>
