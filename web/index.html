<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark light"/><title>deal-radar</title>
<link rel="stylesheet" href="/static/tailwind.css"/>
<style>
.card{background:var(--tw-card,#fff);border:1px solid rgb(226 232 240);border-radius:1rem;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.75rem}
.dark .card{background:#0f172a;border-color:#1e293b}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.card img.thumb{width:100%;height:10rem;object-fit:cover;background:#0a0d15}
.card .body{padding:.625rem}.card h4{margin:0 0 .375rem;font-size:.875rem;line-height:1.3;font-weight:600}
.listrow{display:flex;gap:.625rem;background:#fff;border:1px solid rgb(226 232 240);border-radius:.75rem;padding:.5rem;margin:.5rem 0;cursor:pointer;align-items:center}
.dark .listrow{background:#0f172a;border-color:#1e293b}
.listrow img{width:5.625rem;height:4.375rem;object-fit:cover;border-radius:.5rem;background:#0a0d15}
.price{font-weight:700;font-size:1rem}.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;color:#fff}
.risk-low{background:#047857}.risk-medium{background:#b45309}.risk-high{background:#b91c1c}
.lane{font-size:11px;opacity:.65}
.panel{background:#fff;border:1px solid rgb(226 232 240);border-radius:1rem;padding:.75rem;margin:.625rem 0}
.dark .panel{background:#0f172a;border-color:#1e293b}
.skel{border-radius:.75rem;min-height:13.75rem;background:linear-gradient(90deg,#e2e8f0,#cbd5e1,#e2e8f0);background-size:200% 100%;animation:sh 1.1s infinite linear}
.dark .skel{background:linear-gradient(90deg,#0f172a,#1e293b,#0f172a);background-size:200% 100%}
@keyframes sh{to{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1}}#results .card,#results .listrow{animation:fadeUp .25s ease}
#drawer{position:fixed;inset:0;z-index:50;display:none}#drawer.open{display:block}
#drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(2px)}
#drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(35rem,100%);background:#fff;overflow-y:auto;padding:1rem;animation:slideIn .22s ease}
.dark #drawer .sheet{background:#020617}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}}
.car{position:relative;background:#000;border-radius:.625rem;overflow:hidden}
.car img{width:100%;max-height:21.25rem;object-fit:contain;display:block;touch-action:pan-y}
.car button{position:absolute;top:45%;background:rgba(0,0,0,.55);border:none;font-size:20px;color:#fff;border-radius:.5rem;padding:2px 10px}
.car .prev{left:6px}.car .next{right:6px}.car .cnt{position:absolute;bottom:6px;right:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px}
.bar{height:6px;background:rgb(226 232 240);border-radius:99px;overflow:hidden;margin:3px 0}.dark .bar{background:#1e293b}.bar i{display:block;height:100%;background:#3b82f6}
table.cmp{border-collapse:collapse;width:100%;font-size:13px}table.cmp td,table.cmp th{border:1px solid rgb(203 213 225);padding:6px 8px;text-align:left}.dark table.cmp td,.dark table.cmp th{border-color:#1e293b}
#toasts{position:fixed;right:12px;bottom:12px;z-index:60;max-width:21.25rem}.toast{background:#fff;border:1px solid #3b82f6;color:#0f172a;border-radius:.625rem;padding:.625rem;margin-top:.5rem;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:fadeUp .2s ease}
.dark .toast{background:#0f172a;color:#e2e8f0}
.hist{border-left:2px solid #3b82f6;margin:6px 0 6px 4px;padding-left:10px;font-size:12px}
.chip{font-size:12px;border:1px solid rgb(203 213 225);border-radius:99px;padding:4px 10px;cursor:pointer;background:transparent}
.dark .chip{border-color:#334155;color:#e2e8f0}.chip:hover{border-color:#3b82f6}
.err{background:#fef2f2;border:1px solid #ef4444;color:#991b1b;border-radius:.625rem;padding:.625rem;margin:.5rem 0;font-size:13px}
.dark .err{background:#2a1215;color:#fca5a5}
.empty{text-align:center;opacity:.6;padding:2.5rem .625rem}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
.thumbwrap{position:relative}.thumbnav{position:absolute;top:40%;background:rgba(0,0,0,.55);border:none;font-size:18px;padding:4px 8px;color:#fff;border-radius:.375rem}.thumbnav.l{left:4px}.thumbnav.r{right:4px}
.inp{border-radius:.5625rem;padding:.5625rem .625rem;font-size:.875rem;width:100%;border:1px solid rgb(203 213 225);background:#fff;color:#0f172a}
.dark .inp{background:#020617;border-color:#334155;color:#e2e8f0}
.btn{border-radius:.5625rem;padding:.5625rem .875rem;font-size:.875rem;font-weight:600;cursor:pointer;border:1px solid transparent;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:wait}
.btn-primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.btn-primary:hover{filter:brightness(1.15)}
.btn-ghost{background:transparent;border-color:#3b82f6;color:#3b82f6}.btn-ghost:hover{background:rgba(59,130,246,.12)}
input[type=checkbox]{accent-color:#1d4ed8;width:1rem;height:1rem}
select.inp{max-width:100%}
</style>
</head><body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
<header class="sticky top-0 z-20 backdrop-blur border-b border-slate-200 dark:border-slate-800 bg-white/85 dark:bg-slate-950/85">
<div class="max-w-6xl mx-auto px-3 py-2 flex gap-2 items-center flex-wrap">
<b class="text-lg">deal-radar</b>
<button class="btn btn-ghost !px-2" onclick="theme()" title="light/dark" aria-label="toggle theme">◐</button>
<button class="btn btn-ghost" onclick="tab('search')">Search</button>
<button class="btn btn-ghost" onclick="showFavs()">★ <span id="favn">0</span></button>
<button class="btn btn-ghost" onclick="tab('watches')">Watches</button>
<button class="btn btn-ghost" onclick="cmp()">⇄ Compare</button>
<button class="btn btn-ghost" onclick="tab('market')">🏪 Market</button>
<button class="btn btn-ghost" onclick="tab('store')">🧩 Store</button>
<button class="btn btn-ghost" onclick="tab('lab')">🧪 Lab</button>
<a href="/admin" class="text-sm text-blue-500">admin</a>
<button class="btn btn-ghost !px-2" id="vgrid" onclick="setView('grid')" aria-label="grid view">▦</button>
<button class="btn btn-ghost !px-2" id="vlist" onclick="setView('list')" aria-label="list view">☰</button>
</div></header>
<main class="max-w-6xl mx-auto px-3 py-3">
<div class="panel" id="searchpanel">
<div class="flex gap-2 flex-wrap items-center">
<input id="nl" class="inp" style="flex:3;min-width:200px" aria-label="natural language search" placeholder="Ask: iphone with USB-C charging, ThinkPad under €700 without defects…"/>
<button id="askbtn" class="btn btn-primary" onclick="runNL()">Ask</button></div>
<div class="flex gap-2 flex-wrap items-center mt-2">
<input id="q" class="inp" style="flex:2;min-width:160px" aria-label="keyword search" placeholder="keywords: ThinkPad T14 Ryzen 16GB" value="ThinkPad"/>
<input id="min" class="inp" placeholder="min €" style="max-width:90px" type="number"/>
<input id="max" class="inp" placeholder="max €" style="max-width:90px" type="number"/>
<input id="black" class="inp" placeholder="blacklist, comma separated" style="flex:1;min-width:140px"/>
<input id="req" class="inp" placeholder="must contain (required)" style="flex:1;min-width:140px"/>
<button id="searchbtn" class="btn btn-primary" onclick="run()">Search</button></div>
<div class="flex gap-2 flex-wrap items-center mt-2 text-sm" id="sources"></div>
<details class="mt-2 rounded-lg border border-slate-200 dark:border-slate-800 p-2"><summary class="cursor-pointer text-sm opacity-70">advanced: flags, thresholds, drivers</summary>
<div class="flex gap-3 flex-wrap items-center mt-2 text-sm">
<label class="flex gap-1 items-center"><input type="checkbox" id="hideRisk"/> hide risky ≥85%</label>
<label class="flex gap-1 items-center"><input type="checkbox" id="hideGesuche" checked/> hide Gesuche/parts</label>
<label class="flex gap-1 items-center" title="OCR photos"><input type="checkbox" id="fOcr" checked/> OCR</label>
<label class="flex gap-1 items-center" title="CPU benchmarks"><input type="checkbox" id="fBench" checked/> bench</label>
<label class="flex gap-1 items-center" title="photo vision check"><input type="checkbox" id="fVision" checked/> vision</label>
<label class="flex gap-1 items-center" title="detail pages"><input type="checkbox" id="fDet" checked/> details</label>
<input id="warnT" class="inp" title="risk warn %" style="max-width:76px" type="number" value="35" min="0" max="100"/>
<input id="blockT" class="inp" title="risk block %" style="max-width:76px" type="number" value="85" min="0" max="100"/>
<label title="pickup only"><input type="checkbox" id="fPick"/> pickup</label>
<label title="shipped only"><input type="checkbox" id="fShip"/> shipped</label>
<span class="text-sm opacity-70">weights:</span>
<input id="wMatch" class="inp" title="match weight" style="max-width:64px" type="number" value="35" min="0" max="100"/>
<input id="wValue" class="inp" title="value weight" style="max-width:64px" type="number" value="35" min="0" max="100"/>
<input id="wRisk" class="inp" title="risk weight" style="max-width:64px" type="number" value="20" min="0" max="100"/>
<input id="wComp" class="inp" title="completeness weight" style="max-width:64px" type="number" value="10" min="0" max="100"/>
<input id="maxpages" class="inp" title="max pages per source (empty = all)" style="max-width:110px" type="number" min="1" placeholder="pages"/>
</div></details>
<div class="flex gap-2 flex-wrap items-center mt-2">
<select id="sort" class="inp" style="max-width:190px" aria-label="sort order"><option value="score">sort: score</option><option value="plo">price ↑</option><option value="phi">price ↓</option><option value="ppe">perf/€</option><option value="mt">multithread</option><option value="gpe">gpu/€</option></select>
<select id="perpage" class="inp" style="max-width:130px" aria-label="results per page" onchange="PAGE=0;render()"><option>20</option><option>50</option><option>100</option><option value="100000">all</option></select>
<span id="lanes" class="flex gap-1 flex-wrap text-sm"></span></div>
<div class="flex gap-2 flex-wrap items-center mt-2 text-sm"><span class="opacity-60">history:</span><span id="hist" class="flex gap-1 flex-wrap"></span></div>
</div>
<div id="status"></div>
<div class="flex gap-2 items-center justify-center my-3 pager" id="pagertop" style="display:none"><button class="btn btn-ghost" onclick="page(-1)">←</button><span id="pinfotop" class="text-sm"></span><button class="btn btn-ghost" onclick="page(1)">→</button><input id="goto" class="inp" placeholder="page #" type="number" style="max-width:80px"/><button class="btn btn-ghost" onclick="PAGE=Math.max(0,(+$('goto').value||1)-1);render()">go</button></div>
<div id="results"></div>
<div class="flex gap-2 items-center justify-center my-3 pager" id="pager" style="display:none"><button class="btn btn-ghost" onclick="page(-1)">←</button><span id="pinfo" class="text-sm"></span><button class="btn btn-ghost" onclick="page(1)">→</button></div>
</main>
<div id="drawer"><div class="scrim" onclick="closeD()"></div><div class="sheet" id="sheet"></div></div>
<div id="toasts"></div>
<script>

let LAST=[],SID=null,VIEW=localStorage.getItem('drv')||'grid',PAGE=0,HIST=JSON.parse(localStorage.getItem('drh')||'[]');
const $=id=>document.getElementById(id);
function setView(v){VIEW=v;localStorage.setItem('drv',v);render()}
function theme(){const r=document.documentElement;const t=r.classList.contains('dark')?'':'dark';r.classList.toggle('dark',t==='dark');localStorage.setItem('drt',t||'light')}
(function(){const t=localStorage.getItem('drt');document.documentElement.classList.toggle('dark',t!=='light')})();
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('toasts').prepend(d);setTimeout(()=>d.remove(),9000)}
function benchOf(s){const b=(s.enrichments||[]).find(e=>e.field==='cpu_benchmark')||(s.enrichments||[]).find(e=>e.field==='gpu_benchmark');return b?b.value:0}
function perfEur(s){const b=benchOf(s);return (b&&s.listing.price)?b/s.listing.price:0}
function thumb(l,idx){const imgs=l.images||[];if(!imgs.length)return '';const i=idx||0;
return `<div class="thumbwrap"><img class="thumb" loading="lazy" src="${imgs[i%imgs.length]}" onerror="this.remove()">${imgs.length>1?`<button class="thumbnav l" onclick="event.stopPropagation();cyc(this,-1,'${l.id}')">‹</button><button class="thumbnav r" onclick="event.stopPropagation();cyc(this,1,'${l.id}')">›</button>`:''}</div>`}
function cyc(btn,d,id){const s=LAST.find(x=>x.listing.id===id);if(!s||!(s.listing.images||[]).length)return;const n=s.listing.images.length;let i=((+btn.parentElement.dataset.i||0)+d+n)%n;btn.parentElement.dataset.i=i;btn.parentElement.querySelector('img').src=s.listing.images[i]}
function card(s){const l=s.listing;const fav=isFav(l.id)?'★':'☆';
const inner=`${thumb(l)}<div class="body"><h4>${l.title||'(no title)'}</h4>
<div><span class="price">${l.price??'?'} ${l.currency||''}</span> <span class="badge risk-${s.risk.severity}">${(s.risk.score*100).toFixed(0)}% risk</span></div>
<div class="lane">${s.lane} · ${s.final_score} · ${l.source} · ${l.location||''}</div>
<div style="margin-top:6px"><button class="btn btn-ghost" onclick="event.stopPropagation();fav('${l.id}')">${fav}</button></div></div>`;
return VIEW==='grid'?`<div class="card" onclick='openD("${l.id}")'>${inner}</div>`
:`<div class="listrow" onclick='openD("${l.id}")'>${(l.images&&l.images[0])?`<img loading="lazy" src="${l.images[0]}" onerror="this.remove()">`:''}<div><b>${l.title||'(no title)'}</b><br/><span class="price">${l.price??'?'} ${l.currency||''}</span> <span class="badge risk-${s.risk.severity}">${(s.risk.score*100).toFixed(0)}%</span> <span class="lane">${s.lane} · ${l.source}</span> <button class="btn btn-ghost" onclick="event.stopPropagation();fav('${l.id}')">${fav}</button></div></div>`}
let FAVS=new Set();
async function loadFavs(){try{const f=await(await fetch('/favorites')).json();FAVS=new Set(f.map(x=>x.listing_id));$('favn').textContent=f.length}catch(e){}$('favn').textContent=FAVS.size}
function isFav(id){return FAVS.has(id)}
async function fav(id){await fetch('/favorites/'+encodeURIComponent(id),{method:'POST'});await loadFavs();render()}
async function unfav(id){await fetch('/favorites/'+encodeURIComponent(id),{method:'DELETE'});await loadFavs();showFavs()}
function filtered(){let arr=[...LAST];
if($('hideGesuche').checked)arr=arr.filter(s=>!JSON.stringify(s.why).match(/demoted/));
const hide=[...document.querySelectorAll('.lanef:checked')].map(i=>i.value);arr=arr.filter(s=>!hide.includes(s.lane));
const m=$('sort').value;
if(m==='plo')arr.sort((a,b)=>(a.listing.price??1e18)-(b.listing.price??1e18));
else if(m==='phi')arr.sort((a,b)=>(b.listing.price??-1)-(a.listing.price??-1));
else if(m==='ppe')arr.sort((a,b)=>perfEur(b)-perfEur(a));
else if(m==='mt')arr.sort((a,b)=>benchOf(b)-benchOf(a));
else if(m==='gpe')arr.sort((a,b)=>{const gb=x=>{const e=(x.enrichments||[]).find(e=>e.field==='gpu_benchmark');return e&&x.listing.price?e.value/x.listing.price:0};return gb(b)-gb(a)});
else arr.sort((a,b)=>b.final_score-a.final_score);
return arr}
function render(){const arr=filtered();const pp=+$('perpage').value;const pages=Math.max(1,Math.ceil(arr.length/pp));PAGE=Math.min(PAGE,pages-1);
const lanes=[...new Set(LAST.map(s=>s.lane))];
$('lanes').innerHTML=lanes.map(l=>`<label><input type="checkbox" class="lanef" value="${l}" onchange="render()"/> hide ${l}</label>`).join(' ');
const slice=arr.slice(PAGE*pp,PAGE*pp+pp);
$('results').innerHTML=VIEW==='grid'?`<div class="rgrid">${slice.map(card).join('')}</div>`:slice.map(card).join('');
$('results').innerHTML+=arr.length?'':`<div class="empty">No results. Try fewer filters or another query.</div>`;
$('pager').style.display=pages>1?'flex':'none';$('pinfo').textContent=`${PAGE+1}/${pages} · ${arr.length} items`;$('pagertop').style.display=pages>1?'flex':'none';$('pinfotop').textContent=`${PAGE+1}/${pages}`}
function page(d){PAGE+=d;render();window.scrollTo(0,0)}
function skel(n){$('results').innerHTML=VIEW==='grid'?`<div class="rgrid">${'<div class="skel"></div>'.repeat(n)}</div>`:'<div class="skel"></div>'.repeat(3)}
function status(t){$('status').innerHTML=t?`<div class="panel"><small>${t}</small></div>`:''}
function pushHist(q){HIST=[q,...HIST.filter(x=>x!==q)].slice(0,8);localStorage.setItem('drh',JSON.stringify(HIST));drawHist()}
function drawHist(){$('hist').innerHTML=HIST.map(h=>`<button class="ghost chip" onclick="nl.value=${JSON.stringify(h)};runNL()">${h.slice(0,30)}</button>`).join('')}
function intent(){const wm=+$('wMatch').value||0,wv=+$('wValue').value||0,wr=+$('wRisk').value||0,wc=+$('wComp').value||0;
const _s=wm+wv+wr+wc||1;const ranking={match:wm/_s,value:wv/_s,risk:wr/_s,completeness:wc/_s};
return{ranking,blacklist:$('black').value.split(',').filter(Boolean).map(w=>({fields:['title','description'],op:'not_contains',value:w.trim()})),risk:{warning_threshold:+$('warnT').value/100,block_threshold:+$('blockT').value/100,hard_filter_enabled:$('hideRisk').checked},ocr:$('fOcr').checked,benchmarks:$('fBench').checked,vision:$('fVision').checked,details:$('fDet').checked,limit:30,require_pickup:$('fPick').checked,require_shipping:$('fShip').checked}}
async function poll(sid,onDone){for(;;){const r=await(await fetch('/searches/'+sid)).json();
if(r.status==='running'){status(`<small>working… ${r.done||0}/${r.total||'?'} sub-searches (you can keep browsing — toast on finish)</small>`);await new Promise(x=>setTimeout(x,3000));continue}
onDone(r);return}}
async function run(){const sel=[...document.querySelectorAll('#sources input:checked')].map(i=>i.value);
const mn=+$('min').value||undefined,mx=+$('max').value||undefined;
const hard={};if(mn!=null)hard.min_price=mn;if(mx!=null)hard.max_price=mx;
const req=$('req').value.split(',').filter(Boolean).map(w=>({fields:['title','description'],op:'contains',value:w.trim()}));
const mp=+$('maxpages').value||undefined;
const body={keywords:$('q').value,sources:sel,hard,required:req,...intent()};
if(mp)body.max_pages=mp;
$('searchbtn').disabled=true;$('searchbtn').innerHTML='<span class="spin"></span>';skel(6);status('Search started in background …');PAGE=0;
try{const j=await(await fetch('/searches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
pushHist($('q').value);await poll(j.id,r=>{LAST=r.results||[];SID=r.id;render();
status(`<small>${LAST.length} results · filtered out ${r.filtered_out||0} · median ${r.median??'—'} · errors: ${JSON.stringify(r.driver_errors||{})}</small>`);toast(`✓ search done: ${LAST.length} results`)});}catch(e){status(`<div class="err">search failed: ${e}</div>`)}
$('searchbtn').disabled=false;$('searchbtn').textContent='Search'}
async function runNL(){const t=$('nl').value.trim();if(!t)return;const sel=[...document.querySelectorAll('#sources input:checked')].map(i=>i.value);
$('askbtn').disabled=true;$('askbtn').innerHTML='<span class="spin"></span>';skel(6);status('AI is resolving products for: '+t+' …');PAGE=0;
try{const j=await(await fetch('/searches/nl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,sources:sel,limit:30})})).json();
pushHist(t);await poll(j.id,r=>{LAST=r.results||[];SID=r.id;render();
const p=r.parsed||{};status(`<small>understood as <b>${p.keywords||''}</b> · models: ${(p.models||[]).slice(0,6).join(', ')} · ${LAST.length} results · subqueries: ${(r.subqueries||[]).length}</small>`);toast(`✓ NL done: ${LAST.length} results`)});}catch(e){status(`<div class="err">NL search failed: ${e}</div>`)}
$('askbtn').disabled=false;$('askbtn').textContent='Ask'}
async function showFavs(){tab('search');status('★ favorites');try{const f=await(await fetch('/favorites')).json();
$('results').innerHTML=f.map(x=>`<div class="card" style="padding:10px"><b>${x.title||x.listing_id}</b><br/><span class="price">${x.price??'?'}</span> · <a href="${x.url||'#'}" target="_blank">open</a> <button class="btn btn-ghost" onclick="unfav('${x.listing_id}')">✕</button>${x.note?`<br/><small>note: ${x.note}</small>`:''}<div class="hist">${(x.history||[]).map(h=>`<div>${h.kind}: ${h.old} → ${h.new}</div>`).join('')||'no changes tracked yet'}</div></div>`).join('')||`<div class="empty">No favorites yet — tap ☆ on any result.</div>`;$('pager').style.display='none'}catch(e){status(`<div class="err">${e}</div>`)}}
async function unfavWrap(){}
function tab(t){if(t==='watches')showWatches();if(t==='store')showStore();if(t==='market')showMarket();if(t==='lab')showLab();if(t==='search'){$('status').innerHTML='';render()}}
async function showLab(){let st={};try{st=await(await fetch('/lab/status')).json()}catch(e){}
$('results').innerHTML=`<div class="panel"><h3>AI Lab — chat-built plugins</h3><small>${st.enabled?'enabled':'disabled (LAB_ENABLED=0)'} · enrichers: ${(st.enrichers||[]).join(', ')}</small><div class="row" style="margin-top:8px"><select id="labkind" class="inp" style="max-width:140px"><option value="enricher">enricher</option><option value="driver">driver</option></select><input id="labq" class="inp" placeholder="e.g. flag listings with missing charger as incomplete" style="flex:3"/><button id="labbtn" class="btn btn-primary" onclick="mkLab()">Build</button></div><div id="labout"></div></div>`;$('pager').style.display='none'}
async function mkLab(){$('labbtn').disabled=true;$('labout').innerHTML='<small>AI is writing + testing code… (1-3 min)</small>';
try{const r=await(await fetch('/lab/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:$('labkind').value,instruction:$('labq').value})})).json();
$('labout').innerHTML=r.ok?`<div>✅ <b>${r.id}</b> built, checked, hot-loaded.<br/><small>${JSON.stringify(r.checks).slice(0,300)}</small></div>`:`<div class="err">failed: ${r.error}<br/><small>${(r.code||'').slice(0,500)}</small></div>`}catch(e){$('labout').innerHTML=`<div class="err">${e}</div>`}
$('labbtn').disabled=false}
async function showWatches(){status('Watches — re-polled automatically, survive restarts');$('results').innerHTML='<div class="empty">loading watches…</div>';
$('results').innerHTML=`<div class="panel"><div class="row"><input id="wq" class="inp" placeholder="watch query" style="flex:2"/><input id="wmax" class="inp" placeholder="max €" type="number" style="width:90px"/><label><input type="checkbox" id="nNew" checked/> new hits</label><label><input type="checkbox" id="nPrice" checked/> price drops</label><button class="btn btn-primary" onclick="mkWatch()">+ Watch (5 min)</button></div><div id="wlist"></div><div id="nstat"></div></div>`;refreshWatches();
try{const n=await(await fetch('/notifications/status')).json();$('nstat').innerHTML='<small>alert channels: '+n.channels.map(c=>c.type+(c.target||'')).join(', ')+'</small>'}catch(e){}}
async function refreshWatches(){const m=await(await fetch('/metrics.json')).json();$('wlist').innerHTML='<small>active watches poll in background; new matches + price drops notify + appear in toasts.</small>'}
async function mkWatch(){const sel=[...document.querySelectorAll('#sources input:checked')].map(i=>i.value);
const no=[];if($('nNew')?.checked??true)no.push('new_top');if($('nPrice')?.checked??true)no.push('price_drop');
const rules=[];const dp=+$('nDrop').value||0,rk=+$('nRisk').value||0;
if($('nPrice')?.checked&&dp>0)rules.push({kind:'price_drop',min_drop_pct:dp});
if($('nNew')?.checked&&rk>0)rules.push({kind:'new_match',max_risk:rk/100});
const body={keywords:$('wq').value||$('q').value,sources:sel,hard:$('wmax').value?{max_price:+$('wmax').value}:{},...intent(),watch:true,poll_interval_s:300,notify_on:no,notify_rules:rules};
const r=await(await fetch('/searches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
toast('Watch created: '+body.keywords);LAST=r.results||[];SID=r.id;render()}
async function showMarket(src){status('Market — live inventory across all searches');$('results').innerHTML='<div class="empty">loading market…</div>';
try{const r=await(await fetch('/market?limit=60'+(src?'&source='+src:''))).json();
$('results').innerHTML=(r.items||[]).map(x=>`<div class="card" style="padding:0"><a href="${x.url}" target="_blank" style="text-decoration:none;color:inherit">${x.image?`<img class="thumb" loading="lazy" src="${x.image}" onerror="this.remove()">`:''}<div class="body"><h4>${x.title||'(no title)'}</h4><div><span class="price">${x.price??'?'} ${x.currency||''}</span> <span class="lane">${x.source}</span></div></div></a></div>`).join('')||'<div class="empty">Market is empty — run a search first.</div>';
$('results').innerHTML=`<div class="rgrid">${$('results').innerHTML}</div>`;$('pager').style.display='none'}catch(e){status(`<div class="err">${e}</div>`)}}
async function showStore(){status('Plugin marketplace — one-click install, versioned, PR-contributed');$('results').innerHTML='<div class="empty">loading store…</div>';
try{const r=await(await fetch('/marketplace')).json();
const card=(x,kind)=>`<div class="card" style="padding:10px"><b>${x.display_name||x.id}</b> <small>v${x.version||'?'} · ${x.author||''} · ${x.license||''}</small><br/><small>${(x.capabilities||[]).join(', ')}</small><br/>${x.installed?'<span class="badge risk-low">installed</span>':`<button onclick="installX('${kind}','${x.id}')">install</button>`}${x.requires?`<br/><small>needs: ${x.requires.join(', ')}${x.configured?' ✓':' ✗'}</small>`:''}</div>`;
$('results').innerHTML='<h3>Drivers</h3><div class="rgrid">'+(r.drivers||[]).map(x=>card(x,'driver')).join('')+'</div><h3>Enrichers</h3><div class="rgrid">'+(r.enrichers||[]).map(x=>card(x,'enricher')).join('')+'</div><div class="empty">contribute via PR to marketplace/index.json</div>';$('pager').style.display='none'}catch(e){status(`<div class="err">${e}</div>`)}}
async function installX(kind,id){if(kind!=='driver')return toast('enrichers ship with the app / lab builds');const r=await(await fetch('/marketplace/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})).json();toast(r.ok?'✓ installed '+id:'✗ '+(r.error||r.note||'failed'));showStore()}
async function cmp(){if(!SID)return toast('run a search first');status('Comparing…');
const r=await(await fetch('/searches/'+SID+'/compare')).json();
$('results').innerHTML=Object.entries(r.groups||{}).map(([m,rows])=>`<div class="panel"><b>${m}</b> (${rows.length})<table class="cmp"><tr><th>price</th><th>src</th><th>risk</th><th>score</th><th>spec</th><th></th></tr>${rows.map(x=>`<tr><td>${x.price??'?'} ${x.currency||''}</td><td>${x.source}</td><td>${(x.risk*100).toFixed(0)}%</td><td>${x.score}</td><td>${x.cpu?x.cpu+' ('+x.benchmark+')':''}</td><td><a href="${x.url}" target="_blank">open</a></td></tr>`).join('')}</table></div>`).join('')||'<div class="empty">No groups.</div>';$('pager').style.display='none'}
let CAR=[];
function openD(id){const s=LAST.find(x=>x.listing.id===id);if(!s)return toast('result expired — re-run search');const l=s.listing;CAR=l.images||[];let ci=0;
const dna=Object.entries(s.deal_dna||{}).map(([k,v])=>`${k}<div class="bar"><i style="width:${(v*100).toFixed(0)}%"></i></div>`).join('');
const en=(s.enrichments||[]).map(e=>`<div>${e.field}: <b>${e.value}</b> <small>(${(e.confidence*100).toFixed(0)}% · ${e.status})</small></div>`).join('');
$('sheet').innerHTML=`<div class="row"><button class="btn btn-ghost" onclick="closeD()">← back</button><button class="btn btn-ghost" onclick="fav('${l.id}');closeD()">${isFav(l.id)?'★ saved':'☆ save'}</button><a href="${l.url}" target="_blank"><button class="btn btn-primary">open original ↗</button></a></div>
<h3>${l.title||'(no title)'}</h3><div><span class="price">${l.price??'?'} ${l.currency||''}</span> <span class="badge risk-${s.risk.severity}">${(s.risk.score*100).toFixed(0)}% risk</span> <span class="lane">${s.lane} · ${s.final_score}</span></div>
<div class="car" style="margin:10px 0">${CAR.length?`<img id="carimg" src="${CAR[0]}"/>`:''}${CAR.length>1?`<button class="prev" onclick="cgo(-1)">‹</button><button class="next" onclick="cgo(1)">›</button><span class="cnt" id="carcnt">1/${CAR.length}</span>`:''}</div>
<div class="lane">${l.location||''} · ${l.source} · seller: ${l.seller?.name||'—'} · pickup ${l.pickup_available?'✓':'—'} · shipping ${l.shipping_available?'✓':'—'}</div>
<p style="white-space:pre-wrap;font-size:14px">${(l.description||'no description').slice(0,3000)}</p>
<h4>Deal DNA</h4>${dna}${en?'<h4>Specs</h4>'+en:''}
<div class="row" style="margin:8px 0"><input id="cpuin" class="inp" placeholder="correct CPU, e.g. Ryzen 5 PRO 5650U" style="flex:2"/><button class="btn btn-ghost" onclick="setCpu()">set CPU</button></div>
<h4>Why</h4><small>${(s.why||[]).join('<br/>')}</small>
<h4>Risk evidence</h4><small>${(s.risk.reasons||[]).join('<br/>')||'none'}${(s.risk.counter_evidence||[]).length?'<br/>counter: '+s.risk.counter_evidence.join(', '):''}</small>`;
$('drawer').classList.add('open');window._ci=0;window._lid=l.id}
function cgo(d){if(!CAR.length)return;window._ci=(window._ci+d+CAR.length)%CAR.length;$('carimg').src=CAR[window._ci];$('carcnt').textContent=(window._ci+1)+'/'+CAR.length}
async function setCpu(){const v=$('cpuin').value.trim();if(!v)return;const s=LAST.find(x=>x.listing.id===window._lid);if(!s)return toast('re-run search first');
await fetch('/listings/'+encodeURIComponent(s.listing.id)+'/facts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({field:'cpu',value:v})});toast('CPU set — re-running search to AI-check it');run()}
function closeD(){$('drawer').classList.remove('open')}
document.addEventListener('touchstart',e=>{window._tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(!$('drawer').classList.contains('open'))return;const dx=e.changedTouches[0].clientX-window._tx;if(Math.abs(dx)>60)cgo(dx<0?1:-1)});
async function init(){try{const d=await(await fetch('/drivers')).json();
$('sources').innerHTML=d.map(x=>{const ok=x.configured!==false;return `<label style="${ok?'':'opacity:.45'}" title="${ok?'':('needs '+(x.requires||[]).join(','))}"><input type="checkbox" ${ok?'checked':''} value="${x.id}"/> ${x.display_name}${ok?'':' 🔒'}</label>`}).join(' ')}catch(e){}
drawHist();loadFavs();setView(VIEW);
try{const es=new EventSource('/stream');es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.kind!=='new_match'&&m.kind!=='search_done'&&m.kind!=='price')return;toast('⚡ '+(m.kind||'update')+': '+(m.title||m.listing_id||'').slice(0,80))}catch(_){}};es.onerror=()=>{toast('live feed reconnecting…')}}catch(e){}}
init();

</script></body></html>
