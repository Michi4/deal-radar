<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0b0e14"/><title>deal-radar</title>
<style>body{font-family:system-ui,sans-serif;background:#0b0e14;color:#e6e9ef;margin:0}header{padding:12px 16px;border-bottom:1px solid #222}main{padding:16px;max-width:1100px;margin:auto}.card{background:#141a26;border:1px solid #263049;border-radius:10px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:8px;border-radius:8px;border:1px solid #334;background:#0f1522;color:#e6e9ef}button{cursor:pointer;background:#1d4ed8;border-color:#1d4ed8}.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px}.risk-low{background:#064e3b}.risk-medium{background:#92400e}.risk-high{background:#7f1d1d}.lane{opacity:.85;font-size:12px}#events{position:fixed;right:12px;bottom:12px;max-width:340px}</style>
</head><body><header><b>deal-radar</b> <span style="opacity:.6">v0.1 · live second-hand intelligence</span> <span id="live" class="badge risk-low">live</span></header>
<main>
<div class="row">
<input id="nl" placeholder='natural language: e.g. iphone which uses a usb c plug to charge' style="flex:3"/>
<button onclick="runNL()">Ask</button>
</div>
<div class="row">
<input id="q" placeholder="e.g. ThinkPad T14 Ryzen 16GB" style="flex:2" value="ThinkPad"/>
<input id="max" placeholder="max €" style="width:100px" type="number"/>
<input id="black" placeholder="blacklist, comma separated"/>
<button onclick="run()">Search</button>
<label><input type="checkbox" id="hideRisk"/> hide risky ≥85%</label>
</div>
<div class="row" id="sources"></div>
<div class="row"><button onclick="showFavs()">★ Favorites</button> <a href="/admin" style="color:#7aa2ff">admin</a>
<select id="sort"><option value="score">sort: score</option><option value="plo">price ↑</option><option value="phi">price ↓</option><option value="ppe">perf/€</option></select>
<span id="lanes"></span></div>
<div id="results"></div>
</main><div id="events"></div>
<script>
let SRC=[];
async function init(){const d=await(await fetch('/drivers')).json();SRC=d.map(x=>x.id);
document.getElementById('sources').innerHTML=d.map(x=>`<label><input type="checkbox" checked value="${x.id}"/> ${x.display_name}</label>`).join(' ');
const es=new EventSource('/stream');es.onmessage=e=>{const d=document.createElement('div');d.className='card';d.textContent='⚡ '+e.data;document.getElementById('events').prepend(d)};es.onerror=()=>document.getElementById('live').textContent='reconnecting…'}
let LAST=[];
function perfEur(s){const b=(s.enrichments||[]).find(e=>e.field==='cpu_benchmark');return (b&&s.listing.price)?b.value/s.listing.price:0}
function render(){let arr=[...LAST];const hide=[...document.querySelectorAll('.lanef:checked')].map(i=>i.value);
arr=arr.filter(s=>!hide.includes(s.lane));
const m=sort.value;
if(m==='plo')arr.sort((a,b)=>(a.listing.price??1e18)-(b.listing.price??1e18));
else if(m==='phi')arr.sort((a,b)=>(b.listing.price??-1)-(a.listing.price??-1));
else if(m==='ppe')arr.sort((a,b)=>perfEur(b)-perfEur(a));
else arr.sort((a,b)=>b.final_score-a.final_score);
const lanes=[...new Set(LAST.map(s=>s.lane))];
document.getElementById('lanes').innerHTML=lanes.map(l=>`<label><input type="checkbox" class="lanef" value="${l}" onchange="render()"/> hide ${l}</label>`).join(' ');
results.innerHTML=arr.map(card).join('')||'<p>No results (lane filter?).</p>'}
sort.onchange=render;
async function runNL(){const r=await(await fetch('/searches/nl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:nl.value,limit:20})})).json();
alert('parsed: '+JSON.stringify(r.parsed));LAST=r.results||[];render()}
function card(s){const l=s.listing;const en=(s.enrichments||[]).map(e=>`${e.field}: ${e.value}`).join(' · ');
const dna=Object.entries(s.deal_dna||{}).map(([k,v])=>`${k} ${(v*100).toFixed(0)}%`).join(' · ');
return `<div class="card"><b>${l.title||'(no title)'}</b> <span class="badge risk-${s.risk.severity}">${(s.risk.score*100).toFixed(0)}% risk</span> <span class="lane">${s.lane} · score ${s.final_score}</span><br/>${l.price??'?'} ${l.currency} · ${l.source} · ${l.location||''} · <a href="${l.url}" target="_blank">open</a> <button onclick="fav('${l.id}')">★</button>${en?`<br/><small>⚙ ${en}</small>`:''}<br/><small>${(s.why||[]).slice(0,4).join(' · ')}</small><br/><small style="opacity:.6">DNA: ${dna}</small></div>`}
async function run(){const sel=[...document.querySelectorAll('#sources input:checked')].map(i=>i.value);
const body={keywords:q.value,max_price:+max.value||undefined,sources:sel,blacklist:black.value.split(',').filter(Boolean).map(w=>({fields:['title','description'],op:'not_contains',value:w.trim()})),risk:{hard_filter_enabled:hideRisk.checked},limit:20};
const r=await(await fetch('/searches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
LAST=r.results||[];render()}
async function fav(id){await fetch('/favorites/'+encodeURIComponent(id),{method:'POST'});alert('saved ★')}
async function showFavs(){const f=await(await fetch('/favorites')).json();
results.innerHTML=f.map(x=>`<div class="card"><b>${x.title||x.listing_id}</b><br/>${x.price??'?'} · <a href="${x.url||'#'}" target="_blank">open</a> <button onclick="unfav('${x.listing_id}')">✕</button>${x.note?`<br/><small>note: ${x.note}</small>`:''}<br/><small>history: ${(x.history||[]).map(h=>`${h.kind}: ${h.old} → ${h.new}`).join(' · ')||'no changes yet'}</small></div>`).join('')||'<p>No favorites yet.</p>'}
async function unfav(id){await fetch('/favorites/'+encodeURIComponent(id),{method:'DELETE'});showFavs()}
init();
</script></body></html>
