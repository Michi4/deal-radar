<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0b0e14"/><meta name="color-scheme" content="dark light"/><title>deal-radar</title>
<link rel="stylesheet" href="/static/pico.min.css"/>
<style>
:root{--bg:#0b0e14;--cardbtn:#1d4ed8;--panel:#141a26;--line:#263049;--txt:#e6e9ef;--dim:#8b93a7;--acc:#3b82f6;--good:#10b981;--warn:#f59e0b;--bad:#ef4444}
header.topbar{position:sticky;top:0;z-index:20;background:var(--pico-background-color);border-bottom:1px solid var(--pico-muted-border-color);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header.topbar b{font-size:18px;margin:0}
main.wrap{padding:14px;max-width:1200px;margin:auto}
.panel{background:var(--pico-card-background-color);border:1px solid var(--pico-muted-border-color);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input,.row select{margin-bottom:0}
button.ghost{background:transparent;color:var(--pico-primary);border-color:var(--pico-primary)}
#sort,#perpage{max-width:230px;flex:0 1 auto}
#min,#max{max-width:110px;flex:0 1 auto}
#black,#req{flex:2 1 160px}#q{flex:3 1 220px}#nl{flex:4 1 260px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--pico-card-background-color);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card img.thumb{width:100%;height:160px;object-fit:cover;background:#0a0d15}
.card .body{padding:10px}.card h4{margin:0 0 6px;font-size:14px;line-height:1.3}
.listrow{display:flex;gap:10px;background:var(--pico-card-background-color);border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;cursor:pointer;align-items:center}
.listrow img{width:90px;height:70px;object-fit:cover;border-radius:8px;background:#0a0d15}
.price{font-weight:700;font-size:16px}.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.risk-low{background:#064e3b}.risk-medium{background:#92400e}.risk-high{background:#7f1d1d}
.lane{font-size:11px;color:var(--dim)}
.skel{background:linear-gradient(90deg,#141a26,#1d2540,#141a26);border-radius:12px;min-height:220px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.55}}
#drawer{position:fixed;inset:0;z-index:50;display:none}#drawer.open{display:block}
#drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.65)}
#drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:#0d1220;border-left:1px solid var(--line);overflow-y:auto;padding:16px}
.car{position:relative;background:#000;border-radius:10px;overflow:hidden}
.car img{width:100%;max-height:340px;object-fit:contain;display:block;touch-action:pan-y}
.car button{position:absolute;top:45%;background:rgba(0,0,0,.55);border:none;font-size:20px}
.car .prev{left:6px}.car .next{right:6px}.car .cnt{position:absolute;bottom:6px;right:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px}
.bar{height:6px;background:#222a40;border-radius:99px;overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:var(--acc)}
table.cmp{border-collapse:collapse;width:100%;font-size:13px}table.cmp td,table.cmp th{border:1px solid var(--line);padding:6px 8px;text-align:left}
#toasts{position:fixed;right:12px;bottom:12px;z-index:60;max-width:340px}.toast{background:var(--pico-card-background-color);border:1px solid var(--acc);border-radius:10px;padding:10px;margin-top:8px;font-size:13px}
.hist{border-left:2px solid var(--line);margin:6px 0 6px 4px;padding-left:10px;font-size:12px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer}input:checked+.chip, .chip.on{background:#1d4ed8}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0}
.err{background:#2a1215;border:1px solid var(--bad);border-radius:10px;padding:10px;margin:8px 0;font-size:13px}
.empty{text-align:center;color:var(--dim);padding:40px 10px}
.tabs{display:flex;gap:6px}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
.card{transition:transform .15s ease,box-shadow .15s ease}.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
button{transition:filter .15s}.card button:hover{filter:brightness(1.25)}
.thumbwrap{position:relative}.thumbnav{position:absolute;top:40%;background:rgba(0,0,0,.55);border:none;font-size:18px;padding:4px 8px}.thumbnav.l{left:4px}.thumbnav.r{right:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1}}#results .card,#results .listrow{animation:fadeUp .25s ease}
.skel{background:linear-gradient(90deg,var(--panel),#1d2540,var(--panel));background-size:200% 100%;animation:sh 1.1s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
details.adv{border:1px solid var(--pico-muted-border-color);border-radius:10px;padding:8px;margin-top:8px}details.adv summary{cursor:pointer;font-size:13px;color:var(--dim)}
</style>
</head><body>
<header class="topbar"><b>deal-radar</b><button class="ghost" onclick="theme()" title="light/dark" aria-label="toggle theme">◐</button>
<div class="tabs"><button class="ghost" onclick="tab('search')">Search</button><button class="ghost" onclick="showFavs()">★ <span id="favn">0</span></button><button class="ghost" onclick="tab('watches')">Watches</button><button class="ghost" onclick="cmp()">⇄ Compare</button><button class="ghost" onclick="tab('market')">🏪 Market</button><button class="ghost" onclick="tab('store')">🧩 Store</button><button class="ghost" onclick="tab('lab')">🧪 Lab</button><a href="/admin" style="color:#7aa2ff;font-size:13px">admin</a></div>
<div class="tabs"><button class="ghost" id="vgrid" onclick="setView('grid')">▦</button><button class="ghost" id="vlist" onclick="setView('list')">☰</button></div>
</header>
<main class="wrap">
<div class="panel" id="searchpanel">
<div class="row"><input id="nl" aria-label="natural language search" placeholder='Ask: iphone with USB-C charging, ThinkPad under €700 without defects…' style="flex:3"/><button id="askbtn" onclick="runNL()">Ask</button></div>
<div class="row" style="margin-top:8px"><input id="q" aria-label="keyword search" placeholder="keywords: ThinkPad T14 Ryzen 16GB" style="flex:2" value="ThinkPad"/>
<input id="min" placeholder="min €" style="width:90px" type="number"/><input id="max" placeholder="max €" style="width:90px" type="number"/><input id="black" placeholder="blacklist, comma separated" style="flex:1"/><input id="req" placeholder="must contain (required)" style="flex:1"/><button id="searchbtn" onclick="run()">Search</button></div>
<div class="row" id="sources" style="margin-top:8px"></div>
<details class="adv"><summary>advanced: flags, thresholds, drivers</summary><div class="row" style="margin-top:8px">
<label><input type="checkbox" id="hideRisk"/> hide risky ≥85%</label>
<label><input type="checkbox" id="hideGesuche" checked/> hide Gesuche/parts</label>
<label title="OCR photos"><input type="checkbox" id="fOcr" checked/> OCR</label>
<label title="CPU benchmarks"><input type="checkbox" id="fBench" checked/> bench</label>
<label title="photo vision check"><input type="checkbox" id="fVision" checked/> vision</label>
<label title="detail pages"><input type="checkbox" id="fDet" checked/> details</label>
<input id="warnT" title="risk warn %" style="width:76px" type="number" value="35" min="0" max="100"/>
<input id="blockT" title="risk block %" style="width:76px" type="number" value="85" min="0" max="100"/>
</div></details>
<div class="row" style="margin-top:8px"><select id="sort" aria-label="sort order"><option value="score">sort: score</option><option value="plo">price ↑</option><option value="phi">price ↓</option><option value="ppe">perf/€</option><option value="mt">multithread</option><option value="gpe">gpu/€</option></select>
<select id="perpage" aria-label="results per page" onchange="PAGE=0;render()"><option>20</option><option>50</option><option>100</option><option value="100000">all</option></select><span id="lanes" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
<div class="row" style="margin-top:8px"><small>history:</small><span id="hist" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
</div>
<div id="status"></div>
<div class="pager" id="pagertop" style="display:none"><button class="ghost" onclick="page(-1)">←</button><span id="pinfotop"></span><button class="ghost" onclick="page(1)">→</button><input id="goto" placeholder="page #" type="number" style="width:70px"/><button class="ghost" onclick="PAGE=Math.max(0,(+$('goto').value||1)-1);render()">go</button></div>
<div id="results"></div>
<div class="pager" id="pager" style="display:none"><button class="ghost" onclick="page(-1)">←</button><span id="pinfo"></span><button class="ghost" onclick="page(1)">→</button></div>
</main>
<div id="drawer"><div class="scrim" onclick="closeD()"></div><div class="sheet" id="sheet"></div></div>
<div id="toasts"></div>
<script>
let LAST=[],SID=null,VIEW=localStorage.getItem('drv')||'grid',PAGE=0,HIST=JSON.parse(localStorage.getItem('drh')||'[]');
const $=id=>document.getElementById(id);
function setView(v){VIEW=v;localStorage.setItem('drv',v);render()}
function theme(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('drt',t)}
document.documentElement.dataset.theme=localStorage.getItem('drt')||'dark';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('toasts').prepend(d);setTimeout(()=>d.remove(),9000)}
function benchOf(s){const b=(s.enrichments||[]).find(e=>e.field==='cpu_benchmark')||(s.enrichments||[]).find(e=>e.field==='gpu_benchmark');return b?b.value:0}
function perfEur(s){const b=benchOf(s);return (b&&s.listing.price)?b/s.listing.price:0}
function thumb(l,idx){const imgs=l.images||[];if(!imgs.length)return '';const i=idx||0;
return `<div class="thumbwrap"><img class="thumb" loading="lazy" src="${imgs[i%imgs.length]}" onerror="this.remove()">${imgs.length>1?`<button class="thumbnav l" onclick="event.stopPropagation();cyc(this,-1,'${l.id}')">‹</button><button class="thumbnav r" onclick="event.stopPropagation();cyc(this,1,'${l.id}')">›</button>`:''}</div>`}
function cyc(btn,d,id){const s=LAST.find(x=>x.listing.id===id);if(!s||!(s.listing.images||[]).length)return;const n=s.listing.images.length;let i=((+btn.parentElement.dataset.i||0)+d+n)%n;btn.parentElement.dataset.i=i;btn.parentElement.querySelector('img').src=s.listing.images[i]}
function card(s){const l=s.listing;const fav=isFav(l.id)?'★':'☆';
const inner=`${thumb(l)}<div class="body"><h4>${l.title||'(no title)'}</h4>
<div><span class="price">${l.price??'?'} ${l.currency||''}</span> <span class="badge risk-${s.risk.severity}">${(s.risk.score*100).toFixed(0)}% risk</span></div>
<div class="lane">${s.lane} · ${s.final_score} · ${l.source} · ${l.location||''}</div>
<div style="margin-top:6px"><button class="ghost" onclick="event.stopPropagation();fav('${l.id}')">${fav}</button></div></div>`;
return VIEW==='grid'?`<div class="card" onclick='openD("${l.id}")'>${inner}</div>`
:`<div class="listrow" onclick='openD("${l.id}")'>${(l.images&&l.images[0])?`<img loading="lazy" src="${l.images[0]}" onerror="this.remove()">`:''}<div><b>${l.title||'(no title)'}</b><br/><span class="price">${l.price??'?'} ${l.currency||''}</span> <span class="badge risk-${s.risk.severity}">${(s.risk.score*100).toFixed(0)}%</span> <span class="lane">${s.lane} · ${l.source}</span> <button class="ghost" onclick="event.stopPropagation();fav('${l.id}')">${fav}</button></div></div>`}
let FAVS=new Set();
async function loadFavs(){try{const f=await(await fetch('/favorites')).json();FAVS=new Set(f.map(x=>x.listing_id));$('favn').textContent=f.length}catch(e){}$('favn').textContent=FAVS.size}
function isFav(id){return FAVS.has(id)}
async function fav(id){await fetch('/favorites/'+encodeURIComponent(id),{method:'POST'});await loadFavs();render()}
async function unfav(id){await fetch('/favorites/'+encodeURIComponent(id),{method:'DELETE'});await loadFavs();showFavs()}
function filtered(){let arr=[...LAST];
if($('hideGesuche').checked)arr=arr.filter(s=>!JSON.stringify(s.why).match(/demoted/));
const hide=[...document.querySelectorAll('.lanef:checked')].map(i=>i.value);arr=arr.filter(s=>!hide.includes(s.lane));
const m=$('sort').value;
if(m==='plo')arr.sort((a,b)=>(a.listing.price??1e18)-(b.listing.price??1e18));
else if(m==='phi')arr.sort((a,b)=>(b.listing.price??-1)-(a.listing.price??-1));
else if(m==='ppe')arr.sort((a,b)=>perfEur(b)-perfEur(a));
else if(m==='mt')arr.sort((a,b)=>benchOf(b)-benchOf(a));
else if(m==='gpe')arr.sort((a,b)=>{const gb=x=>{const e=(x.enrichments||[]).find(e=>e.field==='gpu_benchmark');return e&&x.listing.price?e.value/x.listing.price:0};return gb(b)-gb(a)});
else arr.sort((a,b)=>b.final_score-a.final_score);
return arr}
function render(){const arr=filtered();const pp=+$('perpage').value;const pages=Math.max(1,Math.ceil(arr.length/pp));PAGE=Math.min(PAGE,pages-1);
const lanes=[...new Set(LAST.map(s=>s.lane))];
$('lanes').innerHTML=lanes.map(l=>`<label><input type="checkbox" class="lanef" value="${l}" onchange="render()"/> hide ${l}</label>`).join(' ');
const slice=arr.slice(PAGE*pp,PAGE*pp+pp);
$('results').innerHTML=VIEW==='grid'?`<div class="rgrid">${slice.map(card).join('')}</div>`:slice.map(card).join('');
$('results').innerHTML+=arr.length?'':`<div class="empty">No results. Try fewer filters or another query.</div>`;
$('pager').style.display=pages>1?'flex':'none';$('pinfo').textContent=`${PAGE+1}/${pages} · ${arr.length} items`;$('pagertop').style.display=pages>1?'flex':'none';$('pinfotop').textContent=`${PAGE+1}/${pages}`}
function page(d){PAGE+=d;render();window.scrollTo(0,0)}
function skel(n){$('results').innerHTML=VIEW==='grid'?`<div class="rgrid">${'<div class="skel"></div>'.repeat(n)}</div>`:'<div class="skel"></div>'.repeat(3)}
function status(t){$('status').innerHTML=t?`<div class="panel"><small>${t}</small></div>`:''}
function pushHist(q){HIST=[q,...HIST.filter(x=>x!==q)].slice(0,8);localStorage.setItem('drh',JSON.stringify(HIST));drawHist()}
function drawHist(){$('hist').innerHTML=HIST.map(h=>`<button class="ghost chip" onclick="nl.value=${JSON.stringify(h)};runNL()">${h.slice(0,30)}</button>`).join('')}
function intent(){return{blacklist:$('black').value.split(',').filter(Boolean).map(w=>({fields:['title','description'],op:'not_contains',value:w.trim()})),risk:{warning_threshold:+$('warnT').value/100,block_threshold:+$('blockT').value/100,hard_filter_enabled:$('hideRisk').checked},ocr:$('fOcr').checked,benchmarks:$('fBench').checked,vision:$('fVision').checked,details:$('fDet').checked,limit:30}}
async function poll(sid,onDone){for(;;){const r=await(await fetch('/searches/'+sid)).json();
if(r.status==='running'){status(`<small>working… ${r.done||0}/${r.total||'?'} sub-searches (you can keep browsing — toast on finish)</small>`);await new Promise(x=>setTimeout(x,3000));continue}
onDone(r);return}}
async function run(){const sel=[...document.querySelectorAll('#sources input:checked')].map(i=>i.value);
const mn=+$('min').value||undefined,mx=+$('max').value||undefined;
const hard={};if(mn!=null)hard.min_price=mn;if(mx!=null)hard.max_price=mx;
const req=$('req').value.split(',').filter(Boolean).map(w=>({fields:['title','description'],op:'contains',value:w.trim()}));
const body={keywords:$('q').value,sources:sel,hard,required:req,...intent()};
$('searchbtn').disabled=true;$('searchbtn').innerHTML='<span class="spin"></span>';skel(6);status('Search started in background …');PAGE=0;
try{const j=await(await fetch('/searches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
pushHist($('q').value);await poll(j.id,r=>{LAST=r.results||[];SID=r.id;render();
status(`<small>${LAST.length} results · filtered out ${r.filtered_out||0} · median ${r.median??'—'} · errors: ${JSON.stringify(r.driver_errors||{})}</small>`);toast(`✓ search done: ${LAST.length} results`)});}catch(e){status(`<div class="err">search failed: ${e}</div>`)}
$('searchbtn').disabled=false;$('searchbtn').textContent='Search'}
async function runNL(){const t=$('nl').value.trim();if(!t)return;const sel=[...document.querySelectorAll('#sources input:checked')].map(i=>i.value);
$('askbtn').disabled=true;$('askbtn').innerHTML='<span class="spin"></span>';skel(6);status('AI is resolving products for: '+t+' …');PAGE=0;
try{const j=await(await fetch('/searches/nl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,sources:sel,limit:30})})).json();
pushHist(t);await poll(j.id,r=>{LAST=r.results||[];SID=r.id;render();
const p=r.parsed||{};status(`<small>understood as <b>${p.keywords||''}</b> · models: ${(p.models||[]).slice(0,6).join(', ')} · ${LAST.length} results · subqueries: ${(r.subqueries||[]).length}</small>`);toast(`✓ NL done: ${LAST.length} results`)});}catch(e){status(`<div class="err">NL search failed: ${e}</div>`)}
$('askbtn').disabled=false;$('askbtn').textContent='Ask'}
async function showFavs(){tab('search');status('★ favorites');try{const f=await(await fetch('/favorites')).json();
$('results').innerHTML=f.map(x=>`<div class="card" style="padding:10px"><b>${x.title||x.listing_id}</b><br/><span class="price">${x.price??'?'}</span> · <a href="${x.url||'#'}" target="_blank">open</a> <button class="ghost" onclick="unfav('${x.listing_id}')">✕</button>${x.note?`<br/><small>note: ${x.note}</small>`:''}<div class="hist">${(x.history||[]).map(h=>`<div>${h.kind}: ${h.old} → ${h.new}</div>`).join('')||'no changes tracked yet'}</div></div>`).join('')||`<div class="empty">No favorites yet — tap ☆ on any result.</div>`;$('pager').style.display='none'}catch(e){status(`<div class="err">${e}</div>`)}}
async function unfavWrap(){}
function tab(t){if(t==='watches')showWatches();if(t==='store')showStore();if(t==='market')showMarket();if(t==='lab')showLab();if(t==='search'){$('status').innerHTML='';render()}}
async function showLab(){let st={};try{st=await(await fetch('/lab/status')).json()}catch(e){}
$('results').innerHTML=`<div class="panel"><h3>AI Lab — chat-built plugins</h3><small>${st.enabled?'enabled':'disabled (LAB_ENABLED=0)'} · enrichers: ${(st.enrichers||[]).join(', ')}</small><div class="row" style="margin-top:8px"><select id="labkind"><option value="enricher">enricher</option><option value="driver">driver</option></select><input id="labq" placeholder="e.g. flag listings with missing charger as incomplete" style="flex:3"/><button id="labbtn" onclick="mkLab()">Build</button></div><div id="labout"></div></div>`;$('pager').style.display='none'}
async function mkLab(){$('labbtn').disabled=true;$('labout').innerHTML='<small>AI is writing + testing code… (1-3 min)</small>';
try{const r=await(await fetch('/lab/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:$('labkind').value,instruction:$('labq').value})})).json();
$('labout').innerHTML=r.ok?`<div>✅ <b>${r.id}</b> built, checked, hot-loaded.<br/><small>${JSON.stringify(r.checks).slice(0,300)}</small></div>`:`<div class="err">failed: ${r.error}<br/><small>${(r.code||'').slice(0,500)}</small></div>`}catch(e){$('labout').innerHTML=`<div class="err">${e}</div>`}
$('labbtn').disabled=false}
async function showWatches(){status('Watches — re-polled automatically, survive restarts');$('results').innerHTML='<div class="empty">loading watches…</div>';
$('results').innerHTML=`<div class="panel"><div class="row"><input id="wq" placeholder="watch query" style="flex:2"/><input id="wmax" placeholder="max €" type="number" style="width:90px"/><label><input type="checkbox" id="nNew" checked/> new hits</label><label><input type="checkbox" id="nPrice" checked/> price drops</label><button onclick="mkWatch()">+ Watch (5 min)</button></div><div id="wlist"></div><div id="nstat"></div></div>`;refreshWatches();
try{const n=await(await fetch('/notifications/status')).json();$('nstat').innerHTML='<small>alert channels: '+n.channels.map(c=>c.type+(c.target||'')).join(', ')+'</small>'}catch(e){}}
async function refreshWatches(){const m=await(await fetch('/metrics.json')).json();$('wlist').innerHTML='<small>active watches poll in background; new matches + price drops notify + appear in toasts.</small>'}
async function mkWatch(){const sel=[...document.querySelectorAll('#sources input:checked')].map(i=>i.value);
const no=[];if($('nNew')?.checked??true)no.push('new_top');if($('nPrice')?.checked??true)no.push('price_drop');
const body={keywords:$('wq').value||$('q').value,sources:sel,hard:$('wmax').value?{max_price:+$('wmax').value}:{},...intent(),watch:true,poll_interval_s:300,notify_on:no};
const r=await(await fetch('/searches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
toast('Watch created: '+body.keywords);LAST=r.results||[];SID=r.id;render()}
async function showMarket(src){status('Market — live inventory across all searches');$('results').innerHTML='<div class="empty">loading market…</div>';
try{const r=await(await fetch('/market?limit=60'+(src?'&source='+src:''))).json();
$('results').innerHTML=(r.items||[]).map(x=>`<div class="card" style="padding:0"><a href="${x.url}" target="_blank" style="text-decoration:none;color:inherit">${x.image?`<img class="thumb" loading="lazy" src="${x.image}" onerror="this.remove()">`:''}<div class="body"><h4>${x.title||'(no title)'}</h4><div><span class="price">${x.price??'?'} ${x.currency||''}</span> <span class="lane">${x.source}</span></div></div></a></div>`).join('')||'<div class="empty">Market is empty — run a search first.</div>';
$('results').innerHTML=`<div class="rgrid">${$('results').innerHTML}</div>`;$('pager').style.display='none'}catch(e){status(`<div class="err">${e}</div>`)}}
async function showStore(){status('Plugin marketplace — one-click install, versioned, PR-contributed');$('results').innerHTML='<div class="empty">loading store…</div>';
try{const r=await(await fetch('/marketplace')).json();
const card=(x,kind)=>`<div class="card" style="padding:10px"><b>${x.display_name||x.id}</b> <small>v${x.version||'?'} · ${x.author||''} · ${x.license||''}</small><br/><small>${(x.capabilities||[]).join(', ')}</small><br/>${x.installed?'<span class="badge risk-low">installed</span>':`<button onclick="installX('${kind}','${x.id}')">install</button>`}${x.requires?`<br/><small>needs: ${x.requires.join(', ')}${x.configured?' ✓':' ✗'}</small>`:''}</div>`;
$('results').innerHTML='<h3>Drivers</h3><div class="rgrid">'+(r.drivers||[]).map(x=>card(x,'driver')).join('')+'</div><h3>Enrichers</h3><div class="rgrid">'+(r.enrichers||[]).map(x=>card(x,'enricher')).join('')+'</div><div class="empty">contribute via PR to marketplace/index.json</div>';$('pager').style.display='none'}catch(e){status(`<div class="err">${e}</div>`)}}
async function installX(kind,id){if(kind!=='driver')return toast('enrichers ship with the app / lab builds');const r=await(await fetch('/marketplace/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})).json();toast(r.ok?'✓ installed '+id:'✗ '+(r.error||r.note||'failed'));showStore()}
async function cmp(){if(!SID)return toast('run a search first');status('Comparing…');
const r=await(await fetch('/searches/'+SID+'/compare')).json();
$('results').innerHTML=Object.entries(r.groups||{}).map(([m,rows])=>`<div class="panel"><b>${m}</b> (${rows.length})<table class="cmp"><tr><th>price</th><th>src</th><th>risk</th><th>score</th><th>spec</th><th></th></tr>${rows.map(x=>`<tr><td>${x.price??'?'} ${x.currency||''}</td><td>${x.source}</td><td>${(x.risk*100).toFixed(0)}%</td><td>${x.score}</td><td>${x.cpu?x.cpu+' ('+x.benchmark+')':''}</td><td><a href="${x.url}" target="_blank">open</a></td></tr>`).join('')}</table></div>`).join('')||'<div class="empty">No groups.</div>';$('pager').style.display='none'}
let CAR=[];
function openD(id){const s=LAST.find(x=>x.listing.id===id);if(!s)return toast('result expired — re-run search');const l=s.listing;CAR=l.images||[];let ci=0;
const dna=Object.entries(s.deal_dna||{}).map(([k,v])=>`${k}<div class="bar"><i style="width:${(v*100).toFixed(0)}%"></i></div>`).join('');
const en=(s.enrichments||[]).map(e=>`<div>${e.field}: <b>${e.value}</b> <small>(${(e.confidence*100).toFixed(0)}% · ${e.status})</small></div>`).join('');
$('sheet').innerHTML=`<div class="row"><button class="ghost" onclick="closeD()">← back</button><button onclick="fav('${l.id}');closeD()">${isFav(l.id)?'★ saved':'☆ save'}</button><a href="${l.url}" target="_blank"><button>open original ↗</button></a></div>
<h3>${l.title||'(no title)'}</h3><div><span class="price">${l.price??'?'} ${l.currency||''}</span> <span class="badge risk-${s.risk.severity}">${(s.risk.score*100).toFixed(0)}% risk</span> <span class="lane">${s.lane} · ${s.final_score}</span></div>
<div class="car" style="margin:10px 0">${CAR.length?`<img id="carimg" src="${CAR[0]}"/>`:''}${CAR.length>1?`<button class="prev" onclick="cgo(-1)">‹</button><button class="next" onclick="cgo(1)">›</button><span class="cnt" id="carcnt">1/${CAR.length}</span>`:''}</div>
<div class="lane">${l.location||''} · ${l.source} · seller: ${l.seller?.name||'—'} · pickup ${l.pickup_available?'✓':'—'} · shipping ${l.shipping_available?'✓':'—'}</div>
<p style="white-space:pre-wrap;font-size:14px">${(l.description||'no description').slice(0,3000)}</p>
<h4>Deal DNA</h4>${dna}${en?'<h4>Specs</h4>'+en:''}
<div class="row" style="margin:8px 0"><input id="cpuin" placeholder="correct CPU, e.g. Ryzen 5 PRO 5650U" style="flex:2"/><button class="ghost" onclick="setCpu()">set CPU</button></div>
<h4>Why</h4><small>${(s.why||[]).join('<br/>')}</small>
<h4>Risk evidence</h4><small>${(s.risk.reasons||[]).join('<br/>')||'none'}${(s.risk.counter_evidence||[]).length?'<br/>counter: '+s.risk.counter_evidence.join(', '):''}</small>`;
$('drawer').classList.add('open');window._ci=0;window._lid=l.id}
function cgo(d){if(!CAR.length)return;window._ci=(window._ci+d+CAR.length)%CAR.length;$('carimg').src=CAR[window._ci];$('carcnt').textContent=(window._ci+1)+'/'+CAR.length}
async function setCpu(){const v=$('cpuin').value.trim();if(!v)return;const s=LAST.find(x=>x.listing.id===window._lid);if(!s)return toast('re-run search first');
await fetch('/listings/'+encodeURIComponent(s.listing.id)+'/facts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({field:'cpu',value:v})});toast('CPU set — re-running search to AI-check it');run()}
function closeD(){$('drawer').classList.remove('open')}
document.addEventListener('touchstart',e=>{window._tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(!$('drawer').classList.contains('open'))return;const dx=e.changedTouches[0].clientX-window._tx;if(Math.abs(dx)>60)cgo(dx<0?1:-1)});
async function init(){try{const d=await(await fetch('/drivers')).json();
$('sources').innerHTML=d.map(x=>{const ok=x.configured!==false;return `<label style="${ok?'':'opacity:.45'}" title="${ok?'':('needs '+(x.requires||[]).join(','))}"><input type="checkbox" ${ok?'checked':''} value="${x.id}"/> ${x.display_name}${ok?'':' 🔒'}</label>`}).join(' ')}catch(e){}
drawHist();loadFavs();setView(VIEW);
try{const es=new EventSource('/stream');es.onmessage=e=>{try{const m=JSON.parse(e.data);toast('⚡ '+(m.kind||'update')+': '+(m.title||m.listing_id||'').slice(0,80))}catch(_){toast('⚡ '+e.data.slice(0,120))}};es.onerror=()=>{toast('live feed reconnecting…')}}catch(e){}}
init();
</script></body></html>
