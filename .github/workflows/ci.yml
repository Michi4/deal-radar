name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]" && pip install "ruff==0.16.9" "mypy==2.3.1" pytest-cov
      - run: ruff check packages drivers apps tests
      - run: mypy packages/deal_radar
      - run: PYTHONPATH=packages:drivers pytest -q --cov --cov-report=term-missing
