<link rel="apple-touch-icon" href="/static/favicon.svg"/>
<link rel="stylesheet" href="/static/tailwind.css"/>
<style>
:root{--acc:#059669;--acc-d:#047857;--acc-soft:rgba(5,150,105,.12)}
.dark{--acc:#34d399;--acc-d:#6ee7b7;--acc-soft:rgba(52,211,153,.12)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html{scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#9db8a5 transparent}
.dark html,.dark{scrollbar-color:#3a4c40 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#b9cdc0;border-radius:8px}
.dark ::-webkit-scrollbar-thumb{background:#31402f}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.card{background:var(--tw-card,#fff);border:1px solid rgb(226 232 240);border-radius:.875rem;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.75rem}
.dark .card{background:#0f172a;border-color:#1e293b}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.18);border-color:var(--acc)}
.card img.thumb{width:100%;height:10rem;object-fit:cover;background:#0a0d15}
.card .body{padding:.75rem}.card h4{margin:0 0 .375rem;font-size:.925rem;line-height:1.35;font-weight:650}
.listrow{display:flex;gap:.625rem;background:#fff;border:1px solid rgb(226 232 240);border-radius:.75rem;padding:.5rem;margin:.5rem 0;cursor:pointer;align-items:center}
.dark .listrow{background:#0f172a;border-color:#1e293b}
.listrow img{width:5.625rem;height:4.375rem;object-fit:cover;border-radius:.5rem;background:#0a0d15}
.price{font-weight:800;font-size:1.05rem;color:var(--acc-d,#047857)}.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;color:#fff}
.risk-low{background:#047857}.risk-medium{background:#b45309}.risk-high{background:#b91c1c}
.lane{font-size:11px;opacity:.65}
.panel{background:#fff;border:1px solid rgb(226 232 240);border-radius:1rem;padding:.75rem;margin:.625rem 0}
.dark .panel{background:#0f172a;border-color:#1e293b}
.skel{border-radius:.75rem;min-height:13.75rem;background:linear-gradient(90deg,#e2e8f0,#cbd5e1,#e2e8f0);background-size:200% 100%;animation:sh 1.1s infinite linear}
.dark .skel{background:linear-gradient(90deg,#0f172a,#1e293b,#0f172a);background-size:200% 100%}
@keyframes sh{to{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1}}#results .card,#results .listrow{animation:fadeUp .25s ease}
#drawer{position:fixed;inset:0;z-index:50;display:none}#drawer.open{display:block}
#drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(2px)}
#drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(35rem,100%);background:#fff;overflow-y:auto;padding:1rem;animation:slideIn .22s ease}
.dark #drawer .sheet{background:#020617}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}}
.car{position:relative;background:#000;border-radius:.625rem;overflow:hidden}
.car img{width:100%;max-height:21.25rem;object-fit:contain;display:block;touch-action:pan-y}
.car button{position:absolute;top:45%;background:rgba(0,0,0,.55);border:none;font-size:20px;color:#fff;border-radius:.5rem;padding:2px 10px}
.car .prev{left:6px}.car .next{right:6px}.car .cnt{position:absolute;bottom:6px;right:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px}
.bar{height:6px;background:rgb(226 232 240);border-radius:99px;overflow:hidden;margin:3px 0}.dark .bar{background:#1e293b}.bar i{display:block;height:100%;background:var(--acc)}
table.cmp{border-collapse:collapse;width:100%;font-size:13px}table.cmp td,table.cmp th{border:1px solid rgb(203 213 225);padding:6px 8px;text-align:left}.dark table.cmp td,.dark table.cmp th{border-color:#1e293b}
#toasts{position:fixed;right:12px;bottom:12px;z-index:60;max-width:21.25rem}.toast{background:#fff;border:1px solid var(--acc);color:#0f172a;border-radius:.625rem;padding:.625rem;margin-top:.5rem;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:fadeUp .2s ease}
.dark .toast{background:#0f172a;color:#e2e8f0}
.hist{border-left:2px solid var(--acc);margin:6px 0 6px 4px;padding-left:10px;font-size:12px}
.seg{display:inline-flex;background:var(--tw-seg,#f1f5f9);border:1px solid rgb(203 213 225);border-radius:12px;padding:3px;gap:2px}
.dark .seg{background:#020617;border-color:#1e293b}
.seg button{border:none;background:transparent;padding:.4rem .8rem;font-size:.83rem;font-weight:600;border-radius:9px;cursor:pointer;color:inherit;opacity:.65}
.seg button.active{background:var(--acc);color:#fff;opacity:1}
.seg button .arr{font-size:.75em;margin-left:2px}
.pills{display:flex;flex-wrap:wrap;gap:.4rem}
.pills button{border:1px solid rgb(203 213 225);background:transparent;color:inherit;border-radius:20px;padding:.35rem .9rem;font-size:.83rem;font-weight:600;cursor:pointer;transition:border-color .12s,background .12s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dark .pills button{border-color:#334155}
.pills button.active{background:var(--acc);border-color:var(--acc);color:#fff}
.pills button.dim{opacity:.45}
.fdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:4px}
.fsec{margin-bottom:.6rem}.flabel{display:block;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:.35rem}
.best-badge{display:inline-block;background:var(--acc);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:2px 10px;margin-bottom:6px}
.chip{font-size:12px;border:1px solid rgb(203 213 225);border-radius:99px;padding:4px 10px;cursor:pointer;background:transparent}
.dark .chip{border-color:#334155;color:#e2e8f0}.chip:hover{border-color:var(--acc)}
.err{background:#fef2f2;border:1px solid #ef4444;color:#991b1b;border-radius:.625rem;padding:.625rem;margin:.5rem 0;font-size:13px}
.dark .err{background:#2a1215;color:#fca5a5}
.empty{text-align:center;opacity:.6;padding:2.5rem .625rem}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
.thumbwrap{position:relative}.thumbnav{position:absolute;top:40%;background:rgba(0,0,0,.55);border:none;font-size:18px;padding:4px 8px;color:#fff;border-radius:.375rem}.thumbnav.l{left:4px}.thumbnav.r{right:4px}
.inp{border-radius:.625rem;padding:.625rem .75rem;font-size:.875rem;width:100%;min-height:44px;border:2px solid rgb(203 213 225);background:#fff;color:#0f172a;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.dark .inp{background:#020617;border-color:#334155;color:#e2e8f0}
.btn{border-radius:.75rem;padding:.625rem .875rem;font-size:.875rem;font-weight:600;cursor:pointer;border:1px solid transparent;transition:background-color .2s,border-color .2s,color .2s,transform .15s,box-shadow .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:wait}
.btn-primary{background:var(--acc);border-color:var(--acc);color:#fff;min-height:44px}.btn-primary:hover{filter:brightness(1.12)}.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:transparent;border-color:var(--acc);color:var(--acc)}.btn-ghost:hover{background:var(--acc-soft)}
input[type=checkbox]{accent-color:var(--acc);width:1.1rem;height:1.1rem}
.navlink{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem .8rem;border-radius:.7rem;font-size:.875rem;font-weight:600;color:#64748b;background:transparent;border:none;cursor:pointer;transition:color .15s,background .15s;white-space:nowrap;text-decoration:none;min-height:44px}
.dark .navlink{color:#94a3b8}.navlink:hover{color:inherit;background:rgba(100,116,139,.12)}
.navlink.active{color:var(--acc-d,#047857);background:var(--acc-soft)}
.dark .navlink.active{color:#34d399}
.navlink .cnt{font-size:.7rem;font-weight:800;background:var(--acc);color:#fff;border-radius:99px;padding:0 .4rem;line-height:1.3}
.logograd{background:linear-gradient(90deg,#34d399,#6ee7b7);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-short{display:none}
@media (max-width: 639px){.logo-full{display:none}.logo-short{display:inline}}
.navlabel{display:none}
@media (min-width: 1024px){.navlabel{display:inline}}
#topnav{height:3.5rem}
@media (min-width: 768px){#topnav{height:4rem}}
#topnav-center{display:none}
@media (min-width: 768px){#topnav-center{display:flex}}
.brandname{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}

.safe-top{padding-top:env(safe-area-inset-top,0px)}.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}

 .dark #bottomnav a,.dark #bottomnav button{color:#64748b}
 #bottomnav .active{color:var(--acc-d,#047857)}.dark #bottomnav .active{color:#34d399}
 body{padding-bottom:4rem}
}
@media (max-width: 600px){
 #searchpanel .nlrow{flex-wrap:wrap}
 #searchpanel .nlrow .inp{flex:1 1 100%;min-width:0}

 #searchpanel .kwgrid{grid-template-columns:1fr !important}
 #searchpanel .kwgrid .btn{width:100%}
}
select.inp{max-width:100%}
</style>

<main class="max-w-6xl mx-auto px-3 py-3">

<div class="flex gap-3 flex-wrap items-center mt-2" id="toolbar" style="display:none">
<div class="seg" role="group" aria-label="sort order" id="sortseg"></div>
<div class="seg" role="group" aria-label="results per page" id="pageseg"></div>
<div class="seg" role="group" aria-label="view"><button id="vgrid" data-act="setView" data-arg="grid" aria-label="grid view" title="Grid view"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button><button id="vlist" data-act="setView" data-arg="list" aria-label="list view" title="List view"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button></div>
<span id="lanes" class="pills"></span></div>
</div>
<div id="status"></div>
<div class="panel" id="applied" style="display:none"></div>
<div class="panel" id="refinebar" style="display:none"><div class="eyebrow">Refine loaded results · no re-search</div>
<div class="flex gap-2 flex-wrap items-center mt-2">
<input id="rMin" class="inp" style="max-width:100px" type="number" placeholder="min €" title="Refine: minimum price"/>
<input id="rMax" class="inp" style="max-width:100px" type="number" placeholder="max €" title="Refine: maximum price"/>
<input id="rBlack" class="inp" style="flex:1;min-width:140px" placeholder="+ blacklist words" title="Refine: hide listings containing these (comma separated)"/>
<input id="rReq" class="inp" style="flex:1;min-width:140px" placeholder="+ must contain" title="Refine: keep only listings containing these (comma separated)"/>
<button class="btn btn-primary" data-act="applyRefine">apply</button><button class="btn btn-ghost" data-act="clearRefine">clear</button>
</div></div>
<div class="flex gap-2 items-center justify-center my-3 pager" id="pagertop" style="display:none"><button class="btn btn-ghost" data-act="page" data-arg="-1">←</button><span id="pinfotop" class="text-sm"></span><button class="btn btn-ghost" data-act="page" data-arg="1">→</button><input id="goto" class="inp" placeholder="page #" type="number" style="max-width:80px"/><button class="btn btn-ghost" data-act="gotoPage">go</button></div>
<div id="results"></div>
<div class="flex gap-2 items-center justify-center my-3 pager" id="pager" style="display:none"><button class="btn btn-ghost" data-act="page" data-arg="-1">←</button><span id="pinfo" class="text-sm"></span><button class="btn btn-ghost" data-act="page" data-arg="1">→</button></div>
</main>
