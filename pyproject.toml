[project]
name = "deal-radar"
version = "0.1.0"
description = "AI-driven used-products finder and comparer — multi-marketplace, live, evidence-first"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.22"]
ocr = ["rapidfuzz>=3.9"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["packages"]
